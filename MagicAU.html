  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 18px 40vh; }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(1.5rem, 4.5vw, 2.1rem);
    margin: 0 0 12px; text-align: center; letter-spacing: 0.04em; text-wrap: balance;
  }
  .sub { text-align: center; color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; }
  h2 {
    font-family: var(--font-display);
    font-size: 1.2rem; color: var(--accent);
    margin: 28px 0 10px; text-wrap: balance;
  }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); }

  /* page nav */
  .bar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(250,240,222,0.9);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 3px 10px rgba(70,45,20,0.25);
  }
  .pager {
    display: flex; gap: 6px; justify-content: flex-start; align-items: center;
    max-width: 860px; margin: 0 auto; padding: 8px 8px; gap: 4px;
    overflow-x: auto; scrollbar-width: none;
  }
  .pager::-webkit-scrollbar { display: none; }
  .pager > :first-child { margin-left: auto; }
  .pager > :last-child { margin-right: auto; }
  .pager button {
    flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
    border-radius: 999px; padding: 4px 7px; font-size: 0.85rem; min-width: 30px;
  }
  .pager button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .pager button.r18 { color: var(--r18); }
  .pager button.r18[aria-current="page"] { background: var(--r18); color: #fff; border-color: var(--r18); }
  .pager button:disabled { opacity: 0.35; cursor: default; }

  /* cards */
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    margin: 0 0 16px; overflow: hidden;
    box-shadow: 0 4px 14px rgba(70,45,20,0.22);
    scroll-margin-top: 64px;
  }
  .card.flash { animation: flash 1.8s ease-out; }
  @keyframes flash {
    0%, 30% { background: var(--flash); border-color: var(--accent); }
    100% { background: var(--surface); }
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px 10px; border-bottom: 1px solid var(--line);
  }
  .card-title { margin: 0; font-family: var(--font-display); font-size: 1.05rem; line-height: 1.4; }
  .card-title .no { color: var(--accent); margin-right: 6px; font-variant-numeric: tabular-nums; }
  .meta { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }
  .copy {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    padding: 7px 16px; border: none; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 0.88rem;
    transition: background-color 0.2s;
  }
  .copy.done { background: var(--flash); color: var(--ink); }
  .copy svg { width: 15px; height: 15px; }
  .head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .text {
    margin: 0; padding: 14px 16px 16px; white-space: pre-wrap; word-break: break-word;
    font-family: var(--font-body); font-size: 0.92rem; line-height: 1.75; color: var(--ink);
  }

  /* home */
  .intro { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; color: var(--muted); font-size: 0.92rem; }
  .intro p { margin: 4px 0; }
  .toc-group { margin: 0 0 6px; }
  .toc-group h3 { font-size: 0.95rem; margin: 16px 0 6px; color: var(--ink); }
  .toc { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
  .toc li {
    display: flex; align-items: stretch;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  }
  .toc li:hover { border-color: var(--accent); }
  .toc a {
    flex: 1; min-width: 0; text-decoration: none; color: var(--ink);
    padding: 7px 10px 7px 12px; font-size: 0.9rem;
  }
  .toc .mini {
    flex: none; width: 40px; border: none; border-left: 1px solid var(--line);
    background: transparent; color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .toc .mini svg { width: 16px; height: 16px; }
  .toc .mini:hover { background: var(--accent-soft); }
  .toc .mini.done { background: var(--flash); color: var(--ink); }
  .tip {
    position: fixed; z-index: 40; max-width: 300px; pointer-events: none;
    background: var(--ink); color: var(--surface); border-radius: 8px;
    padding: 8px 12px; font-size: 0.84rem; line-height: 1.6;
    box-shadow: 0 6px 18px rgba(40,25,10,0.35);
  }
  .toc a .no { color: var(--accent); margin-right: 6px; font-variant-numeric: tabular-nums; }
  .toc.r18 a .no { color: var(--r18); }

  .bottom-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 24px; }
  .bottom-nav button {
    flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 10px; padding: 10px; font-size: 0.92rem;
  }
  .bottom-nav button:disabled { opacity: 0.35; cursor: default; }

  /* floating */
  .float { position: fixed; right: 14px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 20; }
  .float button {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--accent-soft); color: var(--ink); font-size: 0.78rem; line-height: 1.1;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }

  /* age gate */
  .gate {
    position: fixed; inset: 0; background: rgba(58,42,28,0.82); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .gate[hidden] { display: none; }
  .gate-box {
    background: var(--surface); border: 1px solid var(--r18); border-radius: 14px;
    max-width: 360px; width: 100%; padding: 24px 22px; text-align: center;
  }
  .gate-box h2 { color: var(--r18); margin: 0 0 8px; }
  .gate-box p { color: var(--muted); font-size: 0.92rem; margin: 0 0 18px; }
  .gate-btns { display: flex; gap: 10px; }
  .gate-btns button { flex: 1; border-radius: 10px; padding: 10px; font-weight: 700; border: 1px solid var(--line); }
  #gateYes { background: var(--r18); color: var(--accent-ink); border-color: var(--r18); }
  #gateNo { background: var(--surface-2); color: var(--ink); }
  #gateYes { color: #fff; }

  .status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  [hidden] { display: none !important; }
  @media (max-width: 480px) {
    .card-head { padding: 10px 12px 8px; }
    .text { padding: 12px 13px 14px; font-size: 0.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .card.flash { animation-duration: 0.01s; outline: 2px solid var(--accent); }
  }
</style>

      '角色的掃帚因為某個極度荒謬的原因突然失控，載著他在城堡上空亂飛。請避開被人下咒的老梗，自行發揮原因。',
      '請描寫角色在空中的反應、地面上的騷動，以及PC怎麼幫他（或沒幫上忙）。' ] },
    { t: '寵物闖禍', o: 'A', b: [
      '角色的魔法寵物（貓頭鷹、貓、蟾蜍或其他魔法生物）闖了大禍，而且偏偏闖到PC身上。請依照寵物的個性與角色的養育方式，自行發揮事件經過。',
      '角色會怎麼處理這個狀況？' ] },
    { t: '教科書造反', o: 'A', b: [

      'PC在旁邊目睹了一切。' ] }
  ]},
  { rn: 'VIII', cat: 'VIII　生圖咒語', items: [
    { t: '魔杖與魔杖盒', o: 'B', b: [
      B_IMG('想像角色走進魔杖店時被哪一根魔杖「選中」，'),
      '畫面中只能出現魔杖與魔杖盒，嚴禁出現人物、手部、服裝、文字商標、原著既有的魔杖造型，或任何學院與學校的徽章。',
      'prompt需包含：木材種類與紋理色澤、杖芯、長度（英吋）、粗細與彈性、重量與手感、握柄造型、雕刻／鑲嵌／金屬點綴、杖尖形狀、魔杖盒的材質、外型、內襯與開合方式、擺放角度、光線、背景、氛圍與畫風關鍵字。',
      'prompt之後，請以角色的口吻附上一小段「第一次握住這根魔杖時的感覺」。' ] },
    { t: '掃帚', o: 'B', b: [
      B_IMG('想像角色會騎的掃帚，可以是買來的高級款、改裝過的舊款，或是親手做的，'),
      '畫面中只能出現掃帚本體與相關配件，嚴禁出現人物、手部、服裝、文字商標、原著中任何掃帚的品牌名稱或造型，或任何學院與學校的徽章。',
      'prompt需包含：掃帚柄的木材與打磨方式、長度與弧度、尾枝的材質與修剪形狀、腳踏、綁繩、金屬環扣、刻痕或使用痕跡、保養工具或收納架、擺放場景、光線、氛圍與畫風關鍵字。',

    { t: '魔法寵物', o: 'B', b: [
      B_IMG('想像角色入學時帶的寵物，可以是貓頭鷹、貓、蟾蜍或其他魔法生物，'),
      '畫面中嚴禁出現人物、手部、服裝、文字商標，或任何學院與學校的徽章。',
      'prompt需包含：品種、毛色或羽色、體型、眼神與表情、個性帶來的姿態、所在位置（棲架、窗台、行李箱上……）、小配件、光線與畫風關鍵字。',
      'prompt之後，請以角色的口吻介紹寵物的名字與脾氣。' ] },
    { t: '護法', o: 'B', b: [
      B_IMG('想像角色施展護法咒時召喚出的護法形態，'),
      '畫面中只能出現護法本身與場景，嚴禁出現人物、手部、服裝、文字商標，或任何學院與學校的徽章。',
      'prompt需包含：動物種類、銀白色光芒的質感與透明度、動作姿態、光暈與粒子效果、所在場景（夜晚的湖面、森林、走廊……）、氛圍與畫風關鍵字。',
      'prompt之後，請以角色的口吻說說，他看見自己的護法時心裡在想什麼。' ] },
    { t: '行李箱開箱', o: 'B', b: [
      B_IMG('想像角色入學時打包的行李箱，以俯拍平鋪的構圖，'),
      '畫面中嚴禁出現人物、手部、服裝、制服、文字商標，或任何學院與學校的徽章。',
      'prompt需包含：行李箱的材質與外型、內部隔層，以及至少八樣物品（課本、羽毛筆、墨水瓶、坩堝、小藥瓶、零食、私人紀念物……），每一樣都要反映角色的性格，並加上光線與畫風關鍵字。',
      'prompt之後，請以角色的口吻說明哪一樣東西最重要，以及原因。' ] },
    { t: '原創魔藥瓶', o: 'B', b: [
      B_IMG('想像角色親自調製的一瓶原創魔藥並為它命名，'),
      '畫面中嚴禁出現人物、手部、服裝、文字商標，或任何學院與學校的徽章。',
      'prompt需包含：瓶身的形狀、材質與顏色、瓶塞與封蠟、液體的顏色、質感與流動方式（冒泡、發光、旋轉……）、手寫標籤的外觀（標籤上不要有清楚的文字）、擺放場景、光線與畫風關鍵字。',
      'prompt之後，請以角色的口吻寫出這瓶魔藥的功效、副作用與服用說明。' ] },
    { t: '店鋪門面', o: 'B', b: [
      B_IMG('想像角色在魔法街道上開的店，以店門口的視角，'),
      '畫面中嚴禁出現清楚的人物、文字商標，或任何學院與學校的徽章；行人只能以模糊的剪影表示。',
      'prompt需包含：建築風格與外牆材質、招牌造型（招牌上不要有清楚的文字）、櫥窗裡的陳列、門口的小擺設、時間與天氣、光線與畫風關鍵字。',
      'prompt之後，請以角色的口吻介紹這家店的名字與招牌商品。' ] }
  ]}
];

var R18 = { rn: 'R18', cat: 'R18　空想咒語', items: [
  { t: '魔法帳篷的夜晚', o: 'C', b: [
    '兩人在外旅行，住進一頂內部空間比外觀大上許多的魔法帳篷。請描寫角色如何用魔法布置這個只屬於兩人的夜晚：調整溫度、讓光點漂浮在半空、施放隔音的咒語……',
    '布置的方式與風格依角色的性格決定，並細膩描寫兩人之間的親密互動與情緒變化。' ] },
  { t: '自創咒語三連發', o: 'C', b: [
    '角色為了和PC共度的夜晚，偷偷研發了三個原創咒語。請列出每個咒語的仿拉丁文咒語名稱、揮杖方式、效果，以及一個意想不到的副作用。',
    '接著描寫角色實際施展這些咒語的過程：哪一個大成功、哪一個翻車，以及PC的反應。' ] },
  { t: '感官魔藥', o: 'C', b: [
    '角色調製了一瓶能讓感官變得更敏銳的原創魔藥。他事先向PC說明效果與副作用，兩人都同意後才一起服用。請描寫魔藥的顏色、氣味與口感，以及角色說明時的態度。',
    '接著細膩描寫藥效發作後，觸覺、聽覺與溫度感的變化，以及兩人之間的互動。' ] },
  { t: '綁縛咒的遊戲', o: 'C', b: [
    '兩人事先約好，以魔法變出的絲帶或繩索進行一場輕度的綁縛遊戲，並約定一個「解除咒語」當作安全詞，一說出口所有束縛立刻消失。',
    '請依照角色的性格決定誰綁住誰、角色的掌控方式或臣服方式，並細膩描寫過程中的試探、信任與情緒。' ] },
  { t: '不用手的魔杖', o: 'C', b: [
    '兩人打了一個賭：今晚角色不准用手，只能用魔杖。他會怎麼利用飄浮咒、溫度變化或其他魔法，操控羽毛、絲綢或水珠來挑逗PC？',
    '角色能不能忍到最後、這場賭局誰輸誰贏，請依角色的性格決定。' ] },
  { t: '魔法翻車（R18搞笑）', o: 'C', b: [
    '氣氛正好的時候，魔法世界的特性突然出來攪局：牆上的肖像畫醒了、貓頭鷹撞破窗戶送信、床被不小心變形、壁爐裡突然有人探頭……請自行發揮一個極度荒謬的打斷原因。',
    '重點：描寫角色當下的第一反應、肢體與內心戲，以及兩人怎麼收拾殘局、要不要繼續。' ] }
]};

function wrap(l) { return '*(' + l + ')*'; }
function build(item) {
  return OPEN[item.o].concat(item.b, [CLOSE]).map(wrap).join('\n');
}

/* flatten + paginate */
var NORMAL = [];
DATA.forEach(function (g) {
  g.items.forEach(function (it) { it.cat = g.cat; NORMAL.push(it); });
});
NORMAL.forEach(function (it, i) { it.id = 'q' + (i + 1); it.no = String(i + 1); it.text = build(it); });
R18.items.forEach(function (it, i) { it.cat = R18.cat; it.id = 'x' + (i + 1); it.no = 'R' + (i + 1); it.text = build(it); });

var ORDER = ['home'];
var PAGEMAP = { home: { label: '目錄' } };
var ITEMPAGE = {};
DATA.forEach(function (g, i) {
  var key = 'c' + (i + 1);
  ORDER.push(key);
  PAGEMAP[key] = { label: g.rn, items: g.items };
  g.items.forEach(function (it) { ITEMPAGE[it.id] = key; });
});
ORDER.push('r18');
PAGEMAP.r18 = { label: 'R18', items: R18.items };
R18.items.forEach(function (it) { ITEMPAGE[it.id] = 'r18'; });

var view = document.getElementById('view');
var gate = document.getElementById('gate');
var status = document.getElementById('status');
var current = null;
var pending = null;
var ageOK = false;

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function len(s) { return Array.from(s).length; }
var COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>';

function cardHTML(id, no, title, text) {
  return '<article class="card" id="' + id + '">' +
    '<div class="card-head"><h3 class="card-title">' + (no ? '<span class="no">' + esc(no) + '</span>' : '') + esc(title) + '</h3>' +
    '<div class="head-right"><button type="button" class="copy" data-id="' + id + '">' + COPY_ICON + '<span>複製</span></button>' +
    '<span class="meta">' + len(text).toLocaleString('zh-TW') + ' 字元</span></div></div>' +
    '<pre class="text">' + esc(text) + '</pre></article>';
}

var TEXTS = {};
var TIPS = {};
function excerpt(it) {
  var s = it.b[0];
  if (it.o === 'B') s = s.replace(/^請依照角色的核心角色卡、性格、經歷與氣質，/, '').replace(/並提供一段.*$/, '');
  s = s.replace(/[，。、]$/, '');
  return Array.from(s).length > 60 ? Array.from(s).slice(0, 60).join('') + '……' : s;
}
NORMAL.concat(R18.items).forEach(function (it) { TEXTS[it.id] = it.text; TIPS[it.id] = excerpt(it); });

function tocItem(it) {
  return '<li><a href="#' + it.id + '" data-go="' + it.id + '" data-tip="' + it.id + '"><span class="no">' + it.no + '</span>' + esc(it.t) + '</a>' +
    '<button type="button" class="mini" data-id="' + it.id + '" aria-label="複製' + esc(it.t) + '">' + COPY_ICON + '</button></li>';
}

function renderHome() {
  var h = '<h2>📖 目錄</h2>';
  DATA.forEach(function (g) {
    h += '<div class="toc-group"><h3>' + esc(g.cat) + '</h3><ul class="toc">';
    g.items.forEach(function (it) {
      h += tocItem(it);
    });
    h += '</ul></div>';
  });
  h += '<div class="toc-group"><h3>🔞 ' + esc(R18.cat) + '（需確認年齡）</h3><ul class="toc r18">';
  R18.items.forEach(function (it) {
    h += tocItem(it);
  });
  h += '</ul></div>';
  return h;
}

function renderList(items) {
  var h = '';
  var lastCat = null;
  items.forEach(function (it) {
    if (it.cat !== lastCat) { h += '<h2>' + esc(it.cat) + '</h2>'; lastCat = it.cat; }
    h += cardHTML(it.id, it.no, it.t, it.text);
  });
  return h;
}

function pageLabel(p) { return PAGEMAP[p].label; }

function renderPager(page) {
  document.getElementById('pager').innerHTML = ORDER.map(function (p) {
    return '<button type="button" data-page="' + p + '"' + (p === 'r18' ? ' class="r18"' : '') +
      (p === page ? ' aria-current="page"' : '') + '>' + pageLabel(p) + '</button>';
  }).join('');
}

function pageOf(target) {
  if (PAGEMAP[target]) return target;
  if (ITEMPAGE[target]) return ITEMPAGE[target];
  return 'home';
}

function centerCard(el) {
  var bar = document.querySelector('.bar').offsetHeight;
  var rect = el.getBoundingClientRect();
  var avail = window.innerHeight - bar;
  var offset = rect.height < avail ? (avail - rect.height) / 2 : 12;
  var top = window.pageYOffset + rect.top - bar - offset;
  window.scrollTo(0, Math.max(0, top));
}

function show(page, focusId) {
  if (page !== current) {
    if (page === 'home') view.innerHTML = renderHome();
    else view.innerHTML = renderList(PAGEMAP[page].items);
    current = page;
    tip.hidden = true;
  }
  renderPager(page);
  if (focusId) {
    var el = document.getElementById(focusId);
    if (el) {
      el.classList.remove('flash');
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          centerCard(el);
          void el.offsetWidth;
          el.classList.add('flash');
          setTimeout(function () { centerCard(el); }, 250);
        });
      });
    }
  } else {
    window.scrollTo(0, 0);
  }
}

function route(target) {
  var page = pageOf(target);
  var focusId = ITEMPAGE[target] ? target : null;
  if (page === 'r18' && current !== 'r18' && !ageOK) {
    pending = { page: page, focusId: focusId };
    gate.hidden = false;
    document.getElementById('gateYes').focus();
    return;
  }
  show(page, focusId);
}

function go(target) {
  if (location.hash === '#' + target) route(target);
  else location.hash = target;
}

document.getElementById('gateYes').addEventListener('click', function () {
  gate.hidden = true;
  ageOK = true;
  var p = pending; pending = null;
  if (p) show(p.page, p.focusId);
});
document.getElementById('gateNo').addEventListener('click', function () {
  gate.hidden = true;
  pending = null;
  if (location.hash !== '#home') location.hash = 'home';
  else show('home');
});

document.addEventListener('click', function (e) {
  var a = e.target.closest('[data-go]');
  if (a) { e.preventDefault(); go(a.getAttribute('data-go')); return; }
  var b = e.target.closest('[data-page]');
  if (b && !b.disabled && b.getAttribute('data-page')) { go(b.getAttribute('data-page')); return; }
  var c = e.target.closest('.copy, .mini');
  if (c) copy(c);
});

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', '');
  ta.style.position = 'fixed'; ta.style.top = '-1000px';
  document.body.appendChild(ta); ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}
function copy(btn) {
  var text = TEXTS[btn.getAttribute('data-id')];
  var label = btn.querySelector('span');
  function done(ok) {
    if (label) label.textContent = ok ? '已複製' : '複製失敗';
    btn.classList.toggle('done', ok);
    status.textContent = ok ? '已複製到剪貼簿' : '無法自動複製，請手動選取文字';
    setTimeout(function () { if (label) label.textContent = '複製'; btn.classList.remove('done'); }, 1600);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallbackCopy(text)); });
  } else done(fallbackCopy(text));
}

var tip = document.createElement('div');
tip.className = 'tip'; tip.hidden = true; document.body.appendChild(tip);
var canHover = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
if (canHover) {
  document.addEventListener('mouseover', function (e) {
    var a = e.target.closest('[data-tip]');
    if (!a) { tip.hidden = true; return; }
    tip.textContent = TIPS[a.getAttribute('data-tip')] || '';
    tip.hidden = false;
  });
  document.addEventListener('mousemove', function (e) {
    if (tip.hidden) return;
    var x = e.clientX + 14, y = e.clientY + 18;
    var w = tip.offsetWidth, h = tip.offsetHeight;
    if (x + w > window.innerWidth - 8) x = window.innerWidth - w - 8;
    if (y + h > window.innerHeight - 8) y = e.clientY - h - 12;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
  window.addEventListener('scroll', function () { tip.hidden = true; }, { passive: true });
}

window.addEventListener('hashchange', function () { route(location.hash.slice(1)); });
route(location.hash.slice(1) || 'home');
</script>
